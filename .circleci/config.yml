      - run:
          name: Mark dead tuples
          command: |
            printf 'dead 1200\n' > mvcc.cfg
      - run:
          name: Build MVCC engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target mvccVacuum -j2
      - run:
          name: Vacuum dead versions
